version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./movie_booking.db
      - SECRET_KEY=docker_secure_secret_key_demo
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend